  else{var e1=G.proy(rb,0,Rr),e2=G.proy((rb+180)%360,0,Rr);s+='<line x1="'+(c+e1[0])+'" y1="'+(c+e1[1])+'" x2="'+(c+e2[0])+'" y2="'+(c+e2[1])+'" stroke="var(--ink)" stroke-width="3" stroke-dasharray="7 5"/>'}
