function stereoSVG(){var G=E.GEO,Rr=130,c=150,W=300,F=(D.estructuras||[]).filter(G.valida),col=['#E07B22','#2F6FD6','#16A09A','#8A4FD1','#D9476A','#7FC241'];

  for(var a=0;a<360;a+=10){var o=G.proy(a,0,Rr),i=G.proy(a,0,Rr*(a%90?0.96:0.9));s+='<line x1="'+(c+i[0])+'" y1="'+(c+i[1])+'" x2="'+(c+o[0])+'" y2="'+(c+o[1])+'" stroke="var(--mute)" stroke-width="1"/>'}

  else{var e1=G.proy(rb,0,Rr),e2=G.proy((rb+180)%360,0,Rr);s+='<line x1="'+(c+e1[0])+'" y1="'+(c+e1[1])+'" x2="'+(c+e2[0])+'" y2="'+(c+e2[1])+'" stroke="var(--ink)" stroke-width="3" stroke-dasharray="7 5"/>'}

  return s+'</svg>'}
